version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: caresync-db
    environment:
      POSTGRES_USER: caresync
      POSTGRES_PASSWORD: caresync_dev_password
      POSTGRES_DB: caresync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caresync"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: caresync-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
